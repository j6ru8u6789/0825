<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyce化妝品庫存</title>
  <style>
    :root {
      --primary: #e91e63;
      --bg: #fcf4f6;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); 
      margin: 0; 
      padding: 12px; 
      color: #333; 
      font-size: 14px;
    }
    .container { max-width: 1050px; margin: 0 auto; }
    h1 { text-align: center; color: var(--primary); margin: 5px 0 12px 0; font-size: 20px; }
    
    .card { 
      background: white; 
      padding: 12px 14px; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
      margin-bottom: 12px; 
    }

    /* 分頁頁籤 (保養/彩妝/全部) */
    .tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: #eee;
      padding: 4px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* 緊湊型新增表單 */
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
      gap: 8px; 
      margin-bottom: 8px; 
    }
    input, select, button { 
      padding: 8px 10px; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      font-size: 13px; 
      width: 100%; 
      box-sizing: border-box; 
    }
    button.btn-add { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; padding: 8px; }
    button.btn-add:hover { opacity: 0.9; }
    
    .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    
    /* 備份按鈕區塊 */
    .backup-bar {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-backup {
      width: auto;
      padding: 4px 8px;
      font-size: 11px;
      background: #795548;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    /* 圖片縮圖樣式 */
    .item-img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #eee;
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #999;
      flex-shrink: 0;
    }

    /* 標籤樣式 */
    .badge { padding: 2px 5px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge-full { background: #e3f2fd; color: #1976d2; }
    .badge-sample { background: #f3e5f5; color: #7b1fa2; }
    .badge-cat { background: #fff3e0; color: #e65100; margin-right: 4px; }
    
    /* 效期警示樣式 */
    .status-expired { background-color: #ffebee !important; border-left: 4px solid #c62828 !important; }
    .status-warning { background-color: #fff8e1 !important; border-left: 4px solid #e53935 !important; }

    /* 操作小按鈕 */
    .btn-icon {
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-size: 11px;
      color: #555;
    }
    .btn-icon:hover { background: #f0f0f0; }

    /* 電腦版表格樣式 */
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: middle; }
    th { background: #f8f8f8; color: #555; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #eee; }

    /* 📱 手機版卡片式排版 */
    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }

      tr {
        background: white;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        border: 1px solid #f0f0f0;
        position: relative;
      }

      td { padding: 2px 0; border: none; }

      .mobile-card-header {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .mobile-title-area {
        flex: 1;
        padding-right: 55px;
      }

      .mobile-top-actions {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 4px;
      }

      .mobile-meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
        font-size: 13px;
        color: #444;
        background: #f9f9f9;
        padding: 6px 10px;
        border-radius: 6px;
      }

      .mobile-qty-text {
        font-size: 15px;
        font-weight: bold;
        color: #d81b60;
      }

      .mobile-expiry-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
        padding: 6px 10px;
        background: #fafafa;
        border-radius: 6px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>💄 Joyce化妝品庫存</h1>

  <!-- 備份按鈕區塊 -->
  <div class="backup-bar">
    <button class="btn-backup" onclick="exportData()">📤 匯出</button>
    <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 匯入</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
  </div>

  <!-- 分頁頁籤：保養/彩妝/全部 -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-ALL" onclick="switchTab('ALL')">全部</button>
    <button class="tab-btn" id="tab-SKINCARE" onclick="switchTab('SKINCARE')">🧴 保養品</button>
    <button class="tab-btn" id="tab-MAKEUP" onclick="switchTab('MAKEUP')">💄 彩妝品</button>
  </div>

  <!-- 新增商品表單 -->
  <div class="card" style="padding: 10px 12px;">
    <details>
      <summary style="font-weight: bold; cursor: pointer; color: var(--primary); font-size: 14px;">➕ 新增品項 (點擊展開/收合)</summary>
      <form id="itemForm" style="margin-top: 10px;">
        <div class="form-grid">
          <div>
            <input type="text" id="brand" list="brandOptions" placeholder="品牌 (可選擇或直接輸入)" required>
            <datalist id="brandOptions"></datalist>
          </div>
          <input type="text" id="name" placeholder="品名" required>
          <select id="category">
            <option value="化妝水">化妝水</option>
            <option value="精華液">精華液</option>
            <option value="乳液">乳液</option>
            <option value="洗面乳">洗面乳</option>
            <option value="卸妝水">卸妝水</option>
            <option value="去角質">去角質</option>
            <option value="面膜">面膜</option>
            <option value="隔離霜">隔離霜</option>
            <option value="口紅">口紅</option>
            <option value="眼影">眼影</option>
            <option value="其他">其他</option>
          </select>
          <select id="spec">
            <option value="正貨">正貨</option>
            <option value="試用包">試用包</option>
            <option value="小樣">小樣</option>
          </select>
          <input type="text" id="volume" placeholder="容量 (未填單位預設ml)">
          <input type="number" id="quantity" placeholder="數量" value="1" min="1" required>
          <input type="date" id="expiry" required>
          <input type="url" id="imageUrl" placeholder="圖片網址">
        </div>
        <button type="submit" class="btn-add">新增至庫存</button>
      </form>
    </details>
  </div>

  <!-- 篩選、搜尋與排序 -->
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜尋品牌/品名..." oninput="renderItems()" style="flex: 2; min-width: 130px;">
    <select id="filterSpec" onchange="renderItems()" style="flex: 1; min-width: 90px;">
      <option value="ALL">全部規格</option>
      <option value="正貨">正貨</option>
      <option value="試用包">試用包</option>
      <option value="小樣">小樣</option>
    </select>
    <select id="mobileSort" onchange="changeSort(this.value)" style="flex: 1; min-width: 100px;">
      <option value="expiry" selected>依效期排序</option>
      <option value="category">依種類排序</option>
      <option value="brand">依品牌排序</option>
      <option value="name">依品名排序</option>
    </select>
  </div>

  <!-- 清單列表 -->
  <div class="card" style="padding: 0; background: transparent; box-shadow: none;">
    <table>
      <thead>
        <tr>
          <th>照片</th>
          <th class="sortable" onclick="setSort('category')">種類 <span id="sort-category">⇅</span></th>
          <th class="sortable" onclick="setSort('brand')">品牌 / 品名 <span id="sort-brand">⇅</span></th>
          <th>容量</th>
          <th>數量</th>
          <th class="sortable" onclick="setSort('expiry')">有效期限 / 倒數天數 <span id="sort-expiry">⇅</span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="itemList"></tbody>
    </table>
  </div>
</div>

<script>
  let items = JSON.parse(localStorage.getItem('cosmetic_items')) || [];
  let customBrands = JSON.parse(localStorage.getItem('cosmetic_brands')) || [
    "Torriden", "雅漾 (Avene)", "資生堂 (Shiseido)", "AESTURA", "BIOHEAL BOH"
  ];

  let editingId = null;
  let currentTab = 'ALL';
  let sortField = 'expiry'; // 預設依效期排序
  let sortAsc = true;

  const categoryOrder = {
    '化妝水': 1, '精華液': 2, '乳液': 3, '洗面乳': 4,
    '卸妝水': 5, '去角質': 6, '面膜': 7, '隔離霜': 8,
    '口紅': 9, '眼影': 10, '其他': 11
  };

  const skincareCategories = ['化妝水', '精華液', '乳液', '洗面乳', '卸妝水', '去角質', '面膜'];
  const makeupCategories = ['隔離霜', '口紅', '眼影'];

  function updateBrandDatalist() {
    const datalist = document.getElementById('brandOptions');
    datalist.innerHTML = '';
    customBrands.forEach(b => {
      datalist.innerHTML += `<option value="${b}"></option>`;
    });
  }

  function formatVolume(vol) {
    if (!vol || vol.trim() === '') return '-';
    vol = vol.trim();
    if (/^\d+(\.\d+)?$/.test(vol)) {
      return vol + 'ml';
    }
    return vol;
  }

  document.getElementById('itemForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const rawVol = document.getElementById('volume').value;
    const imgUrl = document.getElementById('imageUrl').value.trim();
    const brandName = document.getElementById('brand').value.trim();

    // 動態記憶新品牌
    if (brandName && !customBrands.includes(brandName)) {
      customBrands.push(brandName);
      localStorage.setItem('cosmetic_brands', JSON.stringify(customBrands));
      updateBrandDatalist();
    }

    const newItem = {
      id: Date.now(),
      brand: brandName,
      name: document.getElementById('name').value.trim(),
      category: document.getElementById('category').value,
      spec: document.getElementById('spec').value,
      volume: formatVolume(rawVol),
      quantity: parseInt(document.getElementById('quantity').value),
      expiry: document.getElementById('expiry').value,
      imageUrl: imgUrl
    };

    items.push(newItem);
    saveAndRender();
    this.reset();
  });

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    renderItems();
  }

  function exportData() {
    if (items.length === 0) {
      alert('目前沒有任何資料可匯出！');
      return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `joyce_cosmetics_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedItems = JSON.parse(e.target.result);
        if (Array.isArray(importedItems)) {
          if (confirm('匯入檔案將會覆蓋當前裝置上的資料，確定繼續嗎？')) {
            items = importedItems;
            
            // 匯入時同步自動記錄所有品牌的歷史
            items.forEach(i => {
              if (i.brand && !customBrands.includes(i.brand)) {
                customBrands.push(i.brand);
              }
            });
            localStorage.setItem('cosmetic_brands', JSON.stringify(customBrands));
            updateBrandDatalist();

            saveAndRender();
            alert('資料匯入成功！');
          }
        } else {
          alert('檔案格式不符合！');
        }
      } catch (err) {
        alert('無法讀取該檔案，請確保選擇正確的 JSON 備份檔。');
      }
    };
    reader.readAsText(file);
  }

  function startEdit(id) {
    editingId = id;
    renderItems();
  }

  function copyItem(id) {
    const item = items.find(i => i.id === id);
    if (item) {
      const copiedItem = {
        ...item,
        id: Date.now(),
        quantity: 1
      };
      items.push(copiedItem);
      saveAndRender();
    }
  }

  function saveEdit(id) {
    const item = items.find(i => i.id === id);
    if (item) {
      const newBrand = document.getElementById(`edit-brand-${id}`).value.trim();
      item.brand = newBrand;
      item.name = document.getElementById(`edit-name-${id}`).value.trim();
      item.category = document.getElementById(`edit-cat-${id}`).value;
      item.spec = document.getElementById(`edit-spec-${id}`).value;
      
      const editVol = document.getElementById(`edit-vol-${id}`).value;
      item.volume = formatVolume(editVol);
      
      item.quantity = parseInt(document.getElementById(`edit-qty-${id}`).value);
      item.expiry = document.getElementById(`edit-exp-${id}`).value;
      item.imageUrl = document.getElementById(`edit-img-${id}`).value.trim();

      if (newBrand && !customBrands.includes(newBrand)) {
        customBrands.push(newBrand);
        localStorage.setItem('cosmetic_brands', JSON.stringify(customBrands));
        updateBrandDatalist();
      }
    }
    editingId = null;
    saveAndRender();
  }

  function deleteItem(id) {
    if (confirm('確定要刪除這筆品項嗎？')) {
      items = items.filter(i => i.id !== id);
      editingId = null;
      saveAndRender();
    }
  }

  function saveAndRender() {
    localStorage.setItem('cosmetic_items', JSON.stringify(items));
    renderItems();
  }

  function setSort(field) {
    if (sortField === field) {
      sortAsc = !sortAsc;
    } else {
      sortField = field;
      sortAsc = true;
    }
    document.getElementById('mobileSort').value = field;
    renderItems();
  }

  function changeSort(field) {
    sortField = field;
    sortAsc = true;
    renderItems();
  }

  function handleImgError(el) {
    const parent = el.parentElement;
    parent.innerHTML = `<div class="item-img" style="color:#e53935;">連結失效</div>`;
  }

  function renderItems() {
    const list = document.getElementById('itemList');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filterSpec = document.getElementById('filterSpec').value;
    const isMobile = window.innerWidth <= 600;
    
    ['category', 'brand', 'expiry'].forEach(f => {
      const el = document.getElementById(`sort-${f}`);
      if (el) {
        el.innerText = (sortField === f) ? (sortAsc ? '▲' : '▼') : '⇅';
      }
    });

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    list.innerHTML = '';

    let filtered = items.filter(item => {
      // 分頁頁籤篩選
      if (currentTab === 'SKINCARE' && !skincareCategories.includes(item.category)) return false;
      if (currentTab === 'MAKEUP' && !makeupCategories.includes(item.category)) return false;

      // 關鍵字與規格篩選
      const matchSearch = item.brand.toLowerCase().includes(search) || item.name.toLowerCase().includes(search);
      const matchSpec = filterSpec === 'ALL' || item.spec === filterSpec;
      return matchSearch && matchSpec;
    });

    filtered.sort((a, b) => {
      let result = 0;
      if (sortField === 'category') {
        const orderA = categoryOrder[a.category] || 99;
        const orderB = categoryOrder[b.category] || 99;
        result = orderA - orderB;
      } else if (sortField === 'brand') {
        result = a.brand.localeCompare(b.brand, 'zh-TW');
      } else if (sortField === 'name') {
        result = a.name.localeCompare(b.name, 'zh-TW');
      } else if (sortField === 'expiry') {
        result = new Date(a.expiry) - new Date(b.expiry);
      }
      return sortAsc ? result : -result;
    });

    filtered.forEach(item => {
      const isEditing = (item.id === editingId);
      const expDate = new Date(item.expiry);
      expDate.setHours(0, 0, 0, 0);

      const diffTime = expDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      let statusClass = '';
      let daysNote = '';
      let expiryTextDisplay = item.expiry;

      if (diffDays < 0) {
        statusClass = 'status-expired';
        daysNote = `<span style="color:#c62828; font-weight:bold;">已過期 ${Math.abs(diffDays)} 天</span>`;
        expiryTextDisplay = `<span style="color:#c62828; font-weight:bold;">${item.expiry}</span>`;
      } else if (diffDays === 0) {
        statusClass = 'status-warning';
        daysNote = `<span style="color:#e53935; font-weight:bold;">今天到期！</span>`;
        expiryTextDisplay = `<span style="color:#e53935; font-weight:bold;">${item.expiry}</span>`;
      } else if (diffDays <= 180) {
        statusClass = 'status-warning';
        daysNote = `<span style="color:#e53935; font-weight:bold;">剩 ${diffDays} 天</span>`;
        expiryTextDisplay = `<span style="color:#e53935; font-weight:bold;">${item.expiry}</span>`;
      } else {
        daysNote = `<span style="color:#666;">剩 ${diffDays} 天</span>`;
        expiryTextDisplay = `<span style="color:#666;">${item.expiry}</span>`;
      }

      const specBadge = item.spec === '正貨' ? 'badge-full' : 'badge-sample';
      
      const imgDisplay = item.imageUrl 
        ? `<img src="${item.imageUrl}" class="item-img" alt="照片" onerror="handleImgError(this)">` 
        : `<div class="item-img">無照片</div>`;

      if (isEditing) {
        list.innerHTML += `
          <tr class="${statusClass}">
            <td colspan="7">
              <div style="display:grid; gap:6px;">
                <div style="display:flex; gap:8px; align-items:center;">
                  ${imgDisplay}
                  <input type="url" id="edit-img-${item.id}" value="${item.imageUrl || ''}" placeholder="圖片網址" style="font-size:11px;">
                </div>
                <div style="display:flex; gap:6px;">
                  <select id="edit-cat-${item.id}">
                    <option value="化妝水" ${item.category==='化妝水'?'selected':''}>化妝水</option>
                    <option value="精華液" ${item.category==='精華液'?'selected':''}>精華液</option>
                    <option value="乳液" ${item.category==='乳液'?'selected':''}>乳液</option>
                    <option value="洗面乳" ${item.category==='洗面乳'?'selected':''}>洗面乳</option>
                    <option value="卸妝水" ${item.category==='卸妝水'?'selected':''}>卸妝水</option>
                    <option value="去角質" ${item.category==='去角質'?'selected':''}>去角質</option>
                    <option value="面膜" ${item.category==='面膜'?'selected':''}>面膜</option>
                    <option value="隔離霜" ${item.category==='隔離霜'?'selected':''}>隔離霜</option>
                    <option value="口紅" ${item.category==='口紅'?'selected':''}>口紅</option>
                    <option value="眼影" ${item.category==='眼影'?'selected':''}>眼影</option>
                    <option value="其他" ${item.category==='其他'?'selected':''}>其他</option>
                  </select>
                  <select id="edit-spec-${item.id}">
                    <option value="正貨" ${item.spec==='正貨'?'selected':''}>正貨</option>
                    <option value="試用包" ${item.spec==='試用包'?'selected':''}>試用包</option>
                    <option value="小樣" ${item.spec==='小樣'?'selected':''}>小樣</option>
                  </select>
                </div>
                <input type="text" id="edit-brand-${item.id}" value="${item.brand}" placeholder="品牌" list="brandOptions">
                <input type="text" id="edit-name-${item.id}" value="${item.name}" placeholder="品名">
                <div style="display:flex; gap:6px;">
                  <input type="text" id="edit-vol-${item.id}" value="${item.volume === '-' ? '' : item.volume}" placeholder="容量">
                  <input type="number" id="edit-qty-${item.id}" value="${item.quantity}" min="1" placeholder="數量" style="width:80px;">
                </div>
                <input type="date" id="edit-exp-${item.id}" value="${item.expiry}">
                <div style="text-align:right; margin-top:6px; display:flex; justify-content:flex-end; gap:6px;">
                  <button class="btn-icon" style="background:#ff5252; color:white; border:none; padding:5px 10px;" onclick="deleteItem(${item.id})">🗑️ 刪除品項</button>
                  <button class="btn-icon" style="background:#4caf50; color:white; border:none; padding:5px 10px;" onclick="saveEdit(${item.id})">💾 儲存</button>
                </div>
              </div>
            </td>
          </tr>
        `;
      } else {
        if (isMobile) {
          list.innerHTML += `
            <tr class="${statusClass}">
              <td>
                <div class="mobile-top-actions">
                  <button class="btn-icon" onclick="copyItem(${item.id})">📋 複製</button>
                  <button class="btn-icon" onclick="startEdit(${item.id})">✏️ 編輯</button>
                </div>
                <div class="mobile-card-header">
                  ${imgDisplay}
                  <div class="mobile-title-area">
                    <div>
                      <span class="badge badge-cat">${item.category}</span>
                      <span class="badge ${specBadge}">${item.spec}</span>
                    </div>
                    <div style="font-weight:bold; font-size:14px; margin-top:2px; color:#111;">${item.brand}</div>
                    <div style="color:#444; font-size:13px;">${item.name}</div>
                  </div>
                </div>
                <div class="mobile-meta-row">
                  <div>容量: <strong>${item.volume}</strong></div>
                  <div>數量: <span class="mobile-qty-text">${item.quantity}</span> 個/瓶</div>
                </div>
                <div class="mobile-expiry-row">
                  <div>效期：<strong>${expiryTextDisplay}</strong></div>
                  <div>${daysNote}</div>
                </div>
              </td>
            </tr>
          `;
        } else {
          list.innerHTML += `
            <tr class="${statusClass}">
              <td>${imgDisplay}</td>
              <td><strong>${item.category}</strong></td>
              <td>
                <strong>${item.brand}</strong><br>
                ${item.name} <span class="badge ${specBadge}">${item.spec}</span>
              </td>
              <td>${item.volume}</td>
              <td><strong>${item.quantity}</strong> 個/瓶</td>
              <td>${expiryTextDisplay} <br><small>${daysNote}</small></td>
              <td>
                <button class="btn-icon" onclick="copyItem(${item.id})">📋 複製</button>
                <button class="btn-icon" onclick="startEdit(${item.id})">✏️ 編輯</button>
              </td>
            </tr>
          `;
        }
      }
    });
  }

  updateBrandDatalist();
  window.addEventListener('resize', renderItems);
  renderItems();
</script>
</body>
</html>
