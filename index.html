<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyce化妝品庫存</title>
  <style>
    :root {
      --primary: #e91e63;
      --bg: #fcf4f6;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); 
      margin: 0; 
      padding: 20px; 
      color: #333; 
      font-size: 14px;
    }
    .container { max-width: 1050px; margin: 0 auto; }
    h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
    
    .card { 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
      margin-bottom: 20px; 
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
    input, select, button { 
      padding: 10px; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      font-size: 14px; 
      width: 100%; 
      box-sizing: border-box; 
    }
    button.btn-add { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
    button.btn-add:hover { opacity: 0.9; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    
    /* 備份按鈕區塊 */
    .backup-bar {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .btn-backup {
      width: auto;
      padding: 8px 14px;
      font-size: 12px;
      background: #795548;
      color: white;
      border: none;
      cursor: pointer;
    }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
    th { background: #f8f8f8; color: #555; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #eee; }
    .badge { padding: 3px 6px; border-radius: 8px; font-size: 11px; font-weight: bold; display: inline-block; margin-left: 4px; }
    .badge-full { background: #e3f2fd; color: #1976d2; }
    .badge-sample { background: #f3e5f5; color: #7b1fa2; }
    .status-expired { background-color: #ffebee; color: #c62828; font-weight: bold; }
    .status-warning { background-color: #fff8e1; color: #f57f17; font-weight: bold; }
    
    .item-img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #eee;
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #999;
    }

    .btn-action { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; color: white; margin-right: 4px; }
    .btn-edit { background: #2196f3; }
    .btn-save { background: #4caf50; }
    .btn-delete { background: #ff5252; }
  </style>
</head>
<body>

<div class="container">
  <h1>💄 Joyce化妝品庫存</h1>

  <!-- 新增商品表單 -->
  <div class="card">
    <h3>➕ 新增品項</h3>
    <form id="itemForm">
      <div class="form-grid">
        <input type="text" id="brand" placeholder="品牌 (例: Lancôme)" required>
        <input type="text" id="name" placeholder="品名 (例: 極光水)" required>
        <select id="category">
          <option value="化妝水">化妝水</option>
          <option value="精華液">精華液</option>
          <option value="乳液">乳液</option>
          <option value="洗面乳">洗面乳</option>
          <option value="卸妝水">卸妝水</option>
          <option value="底妝/彩妝">底妝/彩妝</option>
          <option value="其他">其他</option>
        </select>
        <select id="spec">
          <option value="正貨">正貨</option>
          <option value="試用包">試用包</option>
          <option value="小樣">小樣</option>
        </select>
        <input type="text" id="volume" placeholder="容量/單位 (例: 150ml 或 50g)">
        <input type="number" id="quantity" placeholder="數量" value="1" min="1" required>
        <input type="date" id="expiry" required>
        <input type="url" id="imageUrl" placeholder="圖片網址 (貼上圖片連結)">
      </div>
      <button type="submit" class="btn-add">新增至庫存</button>
    </form>
  </div>

  <!-- 備份與資料轉移按鈕 -->
  <div class="backup-bar">
    <button class="btn-backup" onclick="exportData()">📤 匯出資料 (備份至檔案)</button>
    <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 匯入資料 (從檔案載入)</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
  </div>

  <!-- 篩選與搜尋 -->
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜尋品牌或品名..." oninput="renderItems()" style="flex: 2;">
    <select id="filterSpec" onchange="renderItems()" style="flex: 1;">
      <option value="ALL">全部規格</option>
      <option value="正貨">僅看正貨</option>
      <option value="試用包">僅看試用包</option>
      <option value="小樣">僅看小樣</option>
    </select>
  </div>

  <!-- 清單列表 -->
  <div class="card" style="padding: 0; overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>照片</th>
          <th class="sortable" onclick="setSort('category')">種類 <span id="sort-category">⇅</span></th>
          <th class="sortable" onclick="setSort('name')">品牌 / 品名 <span id="sort-name">⇅</span></th>
          <th>容量</th>
          <th>數量</th>
          <th class="sortable" onclick="setSort('expiry')">有效期限 / 倒數天數 <span id="sort-expiry">⇅</span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="itemList"></tbody>
    </table>
  </div>
</div>

<script>
  let items = JSON.parse(localStorage.getItem('cosmetic_items')) || [];
  let editingId = null;
  let sortField = 'category';
  let sortAsc = true;

  const categoryOrder = {
    '化妝水': 1,
    '精華液': 2,
    '乳液': 3,
    '洗面乳': 4,
    '卸妝水': 5,
    '底妝/彩妝': 6,
    '其他': 7
  };

  document.getElementById('itemForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const rawVol = document.getElementById('volume').value.trim();
    const imgUrl = document.getElementById('imageUrl').value.trim();

    const newItem = {
      id: Date.now(),
      brand: document.getElementById('brand').value.trim(),
      name: document.getElementById('name').value.trim(),
      category: document.getElementById('category').value,
      spec: document.getElementById('spec').value,
      volume: rawVol || '-',
      quantity: parseInt(document.getElementById('quantity').value),
      expiry: document.getElementById('expiry').value,
      imageUrl: imgUrl
    };

    items.push(newItem);
    saveAndRender();
    this.reset();
  });

  // 匯出資料成 JSON 檔案
  function exportData() {
    if (items.length === 0) {
      alert('目前沒有任何資料可匯出！');
      return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `joyce_cosmetics_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  // 從 JSON 檔案匯入資料
  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedItems = JSON.parse(e.target.result);
        if (Array.isArray(importedItems)) {
          if (confirm('匯入檔案將會覆蓋當前裝置上的資料，確定繼續嗎？')) {
            items = importedItems;
            saveAndRender();
            alert('資料匯入成功！');
          }
        } else {
          alert('檔案格式不符合！');
        }
      } catch (err) {
        alert('無法讀取該檔案，請確保選擇正確的 JSON 備份檔。');
      }
    };
    reader.readAsText(file);
  }

  function startEdit(id) {
    editingId = id;
    renderItems();
  }

  function saveEdit(id) {
    const item = items.find(i => i.id === id);
    if (item) {
      item.brand = document.getElementById(`edit-brand-${id}`).value.trim();
      item.name = document.getElementById(`edit-name-${id}`).value.trim();
      item.category = document.getElementById(`edit-cat-${id}`).value;
      item.spec = document.getElementById(`edit-spec-${id}`).value;
      
      const editVol = document.getElementById(`edit-vol-${id}`).value.trim();
      item.volume = editVol || '-';
      
      item.quantity = parseInt(document.getElementById(`edit-qty-${id}`).value);
      item.expiry = document.getElementById(`edit-exp-${id}`).value;
      item.imageUrl = document.getElementById(`edit-img-${id}`).value.trim();
    }
    editingId = null;
    saveAndRender();
  }

  function deleteItem(id) {
    if (confirm('確定要刪除這筆品項嗎？')) {
      items = items.filter(i => i.id !== id);
      editingId = null;
      saveAndRender();
    }
  }

  function saveAndRender() {
    localStorage.setItem('cosmetic_items', JSON.stringify(items));
    renderItems();
  }

  function setSort(field) {
    if (sortField === field) {
      sortAsc = !sortAsc;
    } else {
      sortField = field;
      sortAsc = true;
    }
    renderItems();
  }

  function handleImgError(el, id) {
    const parent = el.parentElement;
    parent.innerHTML = `<div class="item-img" style="color:#e53935;">連結失效</div>`;
  }

  function renderItems() {
    const list = document.getElementById('itemList');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filterSpec = document.getElementById('filterSpec').value;
    
    ['category', 'name', 'expiry'].forEach(f => {
      const el = document.getElementById(`sort-${f}`);
      if (el) {
        el.innerText = (sortField === f) ? (sortAsc ? '▲' : '▼') : '⇅';
      }
    });

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    list.innerHTML = '';

    let filtered = items.filter(item => {
      if (item.category === '乳液/面霜') item.category = '乳液';
      if (item.category === '卸妝/清潔') item.category = '洗面乳';
      
      const matchSearch = item.brand.toLowerCase().includes(search) || item.name.toLowerCase().includes(search);
      const matchSpec = filterSpec === 'ALL' || item.spec === filterSpec;
      return matchSearch && matchSpec;
    });

    filtered.sort((a, b) => {
      let result = 0;
      if (sortField === 'category') {
        const orderA = categoryOrder[a.category] || 99;
        const orderB = categoryOrder[b.category] || 99;
        result = orderA - orderB;
      } else if (sortField === 'name') {
        result = a.name.localeCompare(b.name, 'zh-TW');
      } else if (sortField === 'expiry') {
        result = new Date(a.expiry) - new Date(b.expiry);
      }
      return sortAsc ? result : -result;
    });

    filtered.forEach(item => {
      const isEditing = (item.id === editingId);
      const expDate = new Date(item.expiry);
      expDate.setHours(0, 0, 0, 0);

      const diffTime = expDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      let statusClass = '';
      let daysNote = '';

      if (diffDays < 0) {
        statusClass = 'status-expired';
        daysNote = `<br><small style="color:#c62828;">已過期 ${Math.abs(diffDays)} 天</small>`;
      } else if (diffDays === 0) {
        statusClass = 'status-warning';
        daysNote = `<br><small style="color:#f57f17;">今天到期！</small>`;
      } else if (diffDays <= 90) {
        statusClass = 'status-warning';
        daysNote = `<br><small style="color:#f57f17;">剩餘 ${diffDays} 天過期</small>`;
      } else {
        daysNote = `<br><small style="color:#666;">剩餘 ${diffDays} 天過期</small>`;
      }

      const specBadge = item.spec === '正貨' ? 'badge-full' : 'badge-sample';
      
      const imgDisplay = item.imageUrl 
        ? `<img src="${item.imageUrl}" class="item-img" alt="照片" onerror="handleImgError(this, ${item.id})">` 
        : `<div class="item-img">無照片</div>`;

      if (isEditing) {
        list.innerHTML += `
          <tr>
            <td>
              <div style="margin-bottom:4px;">${imgDisplay}</div>
              <input type="url" id="edit-img-${item.id}" value="${item.imageUrl || ''}" placeholder="貼上新圖片網址" style="width:120px; font-size:11px;">
            </td>
            <td>
              <select id="edit-cat-${item.id}">
                <option value="化妝水" ${item.category==='化妝水'?'selected':''}>化妝水</option>
                <option value="精華液" ${item.category==='精華液'?'selected':''}>精華液</option>
                <option value="乳液" ${item.category==='乳液'?'selected':''}>乳液</option>
                <option value="洗面乳" ${item.category==='洗面乳'?'selected':''}>洗面乳</option>
                <option value="卸妝水" ${item.category==='卸妝水'?'selected':''}>卸妝水</option>
                <option value="底妝/彩妝" ${item.category==='底妝/彩妝'?'selected':''}>底妝/彩妝</option>
                <option value="其他" ${item.category==='其他'?'selected':''}>其他</option>
              </select>
            </td>
            <td>
              <input type="text" id="edit-brand-${item.id}" value="${item.brand}" style="margin-bottom:4px;" placeholder="品牌">
              <input type="text" id="edit-name-${item.id}" value="${item.name}" placeholder="品名">
              <select id="edit-spec-${item.id}" style="margin-top:4px;">
                <option value="正貨" ${item.spec==='正貨'?'selected':''}>正貨</option>
                <option value="試用包" ${item.spec==='試用包'?'selected':''}>試用包</option>
                <option value="小樣" ${item.spec==='小樣'?'selected':''}>小樣</option>
              </select>
            </td>
            <td>
              <input type="text" id="edit-vol-${item.id}" value="${item.volume === '-' ? '' : item.volume}" placeholder="容量 (例: 150ml)">
            </td>
            <td>
              <input type="number" id="edit-qty-${item.id}" value="${item.quantity}" min="1" style="width:70px;">
            </td>
            <td>
              <input type="date" id="edit-exp-${item.id}" value="${item.expiry}">
            </td>
            <td>
              <button class="btn-action btn-save" onclick="saveEdit(${item.id})">💾 儲存</button>
              <button class="btn-action btn-delete" onclick="deleteItem(${item.id})">🗑️ 刪除</button>
            </td>
          </tr>
        `;
      } else {
        list.innerHTML += `
          <tr class="${statusClass}">
            <td>${imgDisplay}</td>
            <td><strong>${item.category}</strong></td>
            <td>
              <strong>${item.brand}</strong><br>
              ${item.name} <span class="badge ${specBadge}">${item.spec}</span>
            </td>
            <td>${item.volume}</td>
            <td>${item.quantity}</td>
            <td>${item.expiry}${daysNote}</td>
            <td>
              <button class="btn-action btn-edit" onclick="startEdit(${item.id})">✏️ 編輯</button>
            </td>
          </tr>
        `;
      }
    });
  }

  renderItems();
</script>
</body>
</html>
